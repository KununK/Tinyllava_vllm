[project]
name = "tinyllava-vllm"
version = "0.1.0"
description = "Local Xinference + vLLM environment for TinyLLaVA model serving experiments."
requires-python = ">=3.11,<3.13"
dependencies = [
  "xinference[vllm]",
  "transformers>=4.39.3",
  "accelerate>=0.28.0",
  "sentencepiece>=0.2.0",
  "pillow>=10.0.0",
  "protobuf>=4.25.0",
  "requests>=2.31.0",
  "qwen-omni-utils>=0.0.9",
  "qwen-vl-utils>=0.0.14",
]

[tool.uv]
package = false
